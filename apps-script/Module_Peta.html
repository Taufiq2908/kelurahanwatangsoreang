<script>
window.Module_Peta = {
  render: function(container) {
    if (container) {
      container.innerHTML = `
        <section>
          <div class="page-heading">
            <div>
              <p class="eyebrow">CMS INTERNAL</p>
              <h1>Direktori Peta & Lokasi</h1>
              <p>Kelola data lokasi fasilitas dan kategori pemetaan wilayah.</p>
            </div>
          </div>
          
          <div class="flex border-b border-surface-200 mb-6 gap-6">
            <button class="pb-3 px-1 font-bold border-b-2 transition-colors ${window.PetaState.activeTab === 'lokasi' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-surface-500 hover:text-surface-700'}" id="tab-lokasi">Data Lokasi</button>
            <button class="pb-3 px-1 font-bold border-b-2 transition-colors ${window.PetaState.activeTab === 'kategori' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-surface-500 hover:text-surface-700'}" id="tab-kategori">Kategori Peta</button>
          </div>
          
          <div id="peta-content"></div>
        </section>
      `;
      
      document.getElementById('tab-lokasi').onclick = () => { 
        window.PetaState.activeTab = 'lokasi'; 
        window.PetaState.view = 'list'; 
        this.render(document.querySelector('#main-content')); 
      };
      
      document.getElementById('tab-kategori').onclick = () => { 
        window.PetaState.activeTab = 'kategori'; 
        window.PetaState.catView = 'list'; 
        this.render(document.querySelector('#main-content')); 
      };
    }
    
    if (window.PetaState.activeTab === 'lokasi') {
      if (window.PetaState.view === 'list') {
        if (window.PetaState.categories.length === 0) {
           window.PetaList.loadData();
        } else {
           window.PetaList.renderList();
        }
      } else {
        if (window.PetaForm && window.PetaForm.showForm) {
          window.PetaForm.showForm(window.PetaState.currentId);
        } else {
          document.getElementById('peta-content').innerHTML = "<h2>Form Placeholder (Not Loaded)</h2><button class='btn' id='peta-btn-back'>Back</button>";
          document.getElementById('peta-btn-back').onclick = () => { window.PetaState.view = 'list'; this.render(); };
        }
      }
    } else {
      if (window.PetaState.catView === 'list') {
        window.PetaCategories.loadCategories();
      } else {
        if (window.PetaCategories && window.PetaCategories.showCategoryForm) {
          window.PetaCategories.showCategoryForm(window.PetaState.catCurrentId);
        } else {
          document.getElementById('peta-content').innerHTML = "<h2>Category Form Placeholder (Not Loaded)</h2><button class='btn' id='cat-btn-back'>Back</button>";
          document.getElementById('cat-btn-back').onclick = () => { window.PetaState.catView = 'list'; this.render(); };
        }
      }
    }
  }
};
</script>
