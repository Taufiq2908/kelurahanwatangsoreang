<script>
window.Module_Layanan = (function() {
  let state = {
    view: 'list',
    items: [],
    total: 0,
    page: 1,
    limit: 10,
    search: '',
    category: '',
    currentId: null
  };

  async function loadData() {
    try {
      CMS_UI.showLoader('Memuat data layanan...');
      const res = await CMS_API.getRecords('Layanan', { page: state.page, limit: state.limit, search: state.search, category: state.category, sortBy: 'created_at', sortOrder: 'desc' });
      state.items = res.items || [];
      state.total = res.total || 0;
      renderList();
    } catch(e) {
      CMS_UI.toast('Error loadData: ' + e.message, 'error');
    } finally {
      CMS_UI.hideLoader();
    }
  }

  function renderList() {
    const container = document.getElementById('layanan-content');
    if (!container) return;
    
    let html = `
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <div class="flex flex-wrap gap-3 items-center w-full md:w-auto">
          <input type="text" id="layanan-search" class="w-full md:w-64 px-4 py-2 border border-surface-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Cari layanan..." value="${state.search}">
          <button class="px-4 py-2 bg-surface-100 hover:bg-surface-200 text-surface-700 text-sm font-semibold rounded-xl border border-surface-200" id="layanan-btn-search">Cari</button>
        </div>
        <button class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl shadow-sm flex items-center gap-2" id="layanan-btn-create">
          <span class="material-icons-outlined text-sm">add</span> Tambah Layanan
        </button>
      </div>
      
      <div class="bg-white border border-surface-200 rounded-2xl overflow-hidden shadow-sm mb-6">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface-50 border-b border-surface-200 text-xs uppercase tracking-wider text-surface-500 font-bold">
                <th class="p-4 w-16">Ikon</th>
                <th class="p-4">Nama Layanan</th>
                <th class="p-4">Kategori</th>
                <th class="p-4">Featured</th>
                <th class="p-4">Status</th>
                <th class="p-4 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-surface-100">
    `;
    
    if (state.items.length === 0) {
      html += `<tr><td colspan="6" class="p-12 text-center text-surface-500">Belum ada layanan publik yang ditambahkan.</td></tr>`;
    } else {
      html += state.items.map(item => `
        <tr class="hover:bg-surface-50/50 group">
          <td class="p-4">
            <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
              <i data-lucide="${item.icon || 'file-text'}"></i>
            </div>
          </td>
          <td class="p-4">
            <p class="font-bold text-surface-900">${item.title}</p>
            <p class="text-xs text-surface-500">/${item.slug}</p>
          </td>
          <td class="p-4 text-sm text-surface-600">${item.category || '-'}</td>
          <td class="p-4">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold ${item.featured === 'TRUE' || item.featured === true ? 'bg-amber-100 text-amber-700' : 'bg-surface-100 text-surface-700'}">
              ${item.featured === 'TRUE' || item.featured === true ? 'Featured' : 'Regular'}
            </span>
          </td>
          <td class="p-4">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold ${item.status === 'publish' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
              ${item.status === 'publish' ? 'Publish' : 'Draft'}
            </span>
          </td>
          <td class="p-4 text-right">
            <div class="flex justify-end gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
              <button class="btn-edit p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" data-id="${item.id}"><span class="material-icons-outlined text-[18px]">edit</span></button>
              <button class="btn-delete p-2 text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" data-id="${item.id}" data-title="${CMS_UI.escapeHtml(item.title)}"><span class="material-icons-outlined text-[18px]">delete</span></button>
            </div>
          </td>
        </tr>
      `).join('');
    }
    
    html += `
            </tbody>
          </table>
        </div>
        <div class="p-4 border-t border-surface-100 bg-surface-50/50 flex flex-col sm:flex-row justify-between items-center gap-4">
          <p class="text-sm text-surface-500 font-medium">Halaman ${state.page} dari Total ${state.total} data</p>
          <div class="flex gap-2">
            <button class="px-4 py-2 bg-white border border-surface-200 rounded-lg text-sm" id="layanan-btn-prev" ${state.page <= 1 ? 'disabled' : ''}>Prev</button>
            <button class="px-4 py-2 bg-white border border-surface-200 rounded-lg text-sm" id="layanan-btn-next" ${state.items.length < state.limit ? 'disabled' : ''}>Next</button>
          </div>
        </div>
      </div>
    `;
    
    container.innerHTML = html;
    
    if (window.lucide) {
      window.lucide.createIcons();
    }

    document.getElementById('layanan-btn-create').onclick = () => showForm();
    document.getElementById('layanan-btn-search').onclick = () => {
      state.search = document.getElementById('layanan-search').value;
      state.page = 1;
      loadData();
    };
    document.getElementById('layanan-btn-prev').onclick = () => { state.page--; loadData(); };
    document.getElementById('layanan-btn-next').onclick = () => { state.page++; loadData(); };
    container.querySelectorAll('.btn-edit').forEach(btn => btn.onclick = () => showForm(btn.dataset.id));
    container.querySelectorAll('.btn-delete').forEach(btn => btn.onclick = () => deleteItem(btn.dataset.id, btn.dataset.title));
  }

  async function showForm(id = null) {
    state.view = 'form';
    state.currentId = id;
    let data = { title: '', slug: '', category: 'Administrasi Kependudukan', description: '', requirements: '', icon: 'file-text', featured: 'FALSE', status: 'publish' };
    
    if (id) {
      CMS_UI.showLoader('Memuat data...');
      try {
        data = await CMS_API.getRecord('Layanan', id);
        if (Array.isArray(data.requirements)) {
          data.requirements = data.requirements.join('\\n');
        }
      } catch(e) {
        CMS_UI.toast('Gagal memuat data', 'error');
        window.CMS_FORM_DIRTY = false;
        state.view = 'list';
        render();
        return;
      } finally {
        CMS_UI.hideLoader();
      }
    }
    
    const container = document.getElementById('layanan-content');
    container.innerHTML = `
      <div class="flex justify-between items-center mb-6">
        <button class="btn" id="layanan-btn-back">← Kembali</button>
        <button class="btn btn-primary" id="layanan-btn-save">Simpan Layanan</button>
      </div>
      
      <div style="background:#fff; padding:24px; border-radius:12px; border:1px solid #e2e8f0; max-width:800px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:24px;">
        <div class="form-group" style="grid-column: 1 / -1;">
          <label class="form-label">Nama Layanan</label>
          <input type="text" id="form-title" class="form-control" value="${data.title || ''}" placeholder="Cth: Pembuatan Surat Keterangan Domisili">
        </div>
        <div class="form-group">
          <label class="form-label">Kategori</label>
          <select id="form-category" class="form-control">
            <option value="Administrasi Kependudukan" ${data.category==='Administrasi Kependudukan'?'selected':''}>Administrasi Kependudukan</option>
            <option value="Perizinan" ${data.category==='Perizinan'?'selected':''}>Perizinan</option>
            <option value="Surat Keterangan" ${data.category==='Surat Keterangan'?'selected':''}>Surat Keterangan</option>
            <option value="Lainnya" ${data.category==='Lainnya'?'selected':''}>Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Ikon (Lucide icon name)</label>
          <input type="text" id="form-icon" class="form-control" value="${data.icon || 'file-text'}" placeholder="Cth: file-text, users, map-pin">
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label class="form-label">Deskripsi Singkat</label>
          <textarea id="form-description" class="form-control" rows="3">${data.description || ''}</textarea>
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label class="form-label">Persyaratan (Satu per baris)</label>
          <textarea id="form-requirements" class="form-control" rows="6" placeholder="Cth:\nFotokopi KTP\nFotokopi KK\nSurat Pengantar RT/RW">${(data.requirements || '').replace(/\\n/g, '\n')}</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Featured (Tampil di Beranda)</label>
          <select id="form-featured" class="form-control">
            <option value="TRUE" ${(data.featured === 'TRUE' || data.featured === true) ? 'selected' : ''}>Ya</option>
            <option value="FALSE" ${(data.featured === 'FALSE' || data.featured === false) ? 'selected' : ''}>Tidak</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="form-status" class="form-control">
            <option value="publish" ${data.status === 'publish' ? 'selected' : ''}>Publish</option>
            <option value="draft" ${data.status === 'draft' ? 'selected' : ''}>Draft</option>
          </select>
        </div>
      </div>
    `;
    
    document.getElementById('layanan-btn-back').onclick = async () => {
      if (window.CMS_FORM_DIRTY) {
        const confirmExit = await CMS_UI.confirm('Batal Edit', 'Perubahan belum disimpan. Yakin ingin kembali?', 'Ya, Kembali', 'btn-danger');
        if (!confirmExit) return;
      }
      window.CMS_FORM_DIRTY = false;
      state.view = 'list';
      render();
    };
    document.getElementById('layanan-btn-save').onclick = () => saveItem(id);
  }

  async function saveItem(id) {
    const title = document.getElementById('form-title').value;
    
    const data = {
      title: title,
      slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, ''),
      category: document.getElementById('form-category').value,
      icon: document.getElementById('form-icon').value,
      description: document.getElementById('form-description').value,
      requirements: document.getElementById('form-requirements').value.split('\n').filter(r => r.trim() !== '').join('\\n'),
      featured: document.getElementById('form-featured').value,
      status: document.getElementById('form-status').value
    };
    
    if (!data.title) { CMS_UI.toast('Judul layanan wajib diisi', 'error'); return; }
    
    CMS_UI.showLoader('Menyimpan data...');
    try {
      if (id) {
        await CMS_API.updateRecord('Layanan', id, data);
        CMS_UI.toast('Data berhasil diperbarui');
      } else {
        await CMS_API.createRecord('Layanan', data);
        CMS_UI.toast('Data berhasil dibuat');
      }
      state.view = 'list';
      render();
    } catch(e) {
      CMS_UI.toast(e.message, 'error');
    } finally {
      CMS_UI.hideLoader();
    }
  }

  async function deleteItem(id, title) {
    const confirmed = await CMS_UI.confirm('Hapus Layanan', 'Hapus layanan "' + title + '"? Data akan dipindahkan ke sampah.');
    if (!confirmed) return;
    
    CMS_UI.showLoader('Menghapus...');
    try {
      await CMS_API.deleteRecord('Layanan', id);
      CMS_UI.toast('Data berhasil dihapus');
      loadData();
    } catch(e) {
      CMS_UI.toast(e.message, 'error');
    } finally {
      CMS_UI.hideLoader();
    }
  }

  function render(container) {
    if (container) {
      container.innerHTML = `
        <section>
          <div class="page-heading">
            <div>
              <p class="eyebrow">CMS INTERNAL</p>
              <h1>Layanan Publik</h1>
              <p>Kelola informasi pelayanan administrasi kelurahan.</p>
            </div>
          </div>
          <div id="layanan-content"></div>
        </section>
      `;
    }
    if (state.view === 'list') {
      loadData();
    } else {
      showForm(state.currentId);
    }
  }

  return { render };
})();
</script>
