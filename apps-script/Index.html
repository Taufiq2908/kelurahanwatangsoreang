      window.onerror = function(msg, url, line, col, error) {

           var html = document.documentElement.outerHTML;
           var lines = html.split('\n');
           var failingLine = lines[line - 1] || "Line not found";

        } else {
           alert("CRITICAL ERROR: " + msg + " at line " + line + ":" + col);
        }
      };
